<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counting Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        h1 { color: #333; }
        #count { font-size: 80px; margin: 20px; color: #0070f3; }
        button { font-size: 20px; padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; background: #0070f3; color: white; }
        button:hover { background: #0051bb; }
    </style>
</head>
<body>
    <h1>Simple Counting Game</h1>
    <div id="count">0</div>
    <button onclick="changeCount(1)">Count Up</button>
    <button onclick="changeCount(-1)">Count Down</button>
    <button onclick="resetCount()">Reset</button>

    <script>
        let score = 0;
        const countEl = document.getElementById("count");
        function changeCount(val) {
            score += val;
            countEl.innerText = score;
        }
        function resetCount() {
            score = 0;
            countEl.innerText = score;
        }
    </script>
</body>
</html>
